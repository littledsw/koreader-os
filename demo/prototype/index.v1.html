<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾页 · 交互原型</title>
<link rel="stylesheet" href="../fonts/package/lxgwwenkai-regular.css">
<link rel="stylesheet" href="../fonts/package/lxgwwenkai-bold.css">
<style>
:root{
  --paper:#F4F1E8; --ink:#23231F; --sub:#6F6C63; --faint:#A9A69B;
  --rule:#D6D2C4; --wash:#E8E3D5; --hl:#F0E2B4;
  --red:#B14A3B; --green:#4F6B4A; --amber:#9A6A2F;
  --fs:27px; --lh:1.92;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#1b1b19;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,"LXGW WenKai",sans-serif;}

#device{width:1080px;height:1430px;background:var(--paper);position:relative;overflow:hidden;
        transform-origin:center center;color:var(--ink);}
.screen{position:absolute;inset:0;background:var(--paper);}
.pad{padding:64px 84px;}

.kai{font-family:"LXGW WenKai",Arial,serif;}
.rule{height:1px;background:var(--rule);} .rule-strong{height:2px;background:var(--ink);}
.topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
.brand{font-family:"LXGW WenKai",serif;font-size:38px;letter-spacing:.12em;}
.status{display:flex;align-items:center;gap:16px;font-size:22px;color:var(--sub);letter-spacing:.06em;}

/* boot */
.boot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;cursor:pointer;}
.boot .foot{position:absolute;bottom:70px;font-size:18px;color:var(--faint);letter-spacing:.16em;}

/* home */
.hero{display:flex;gap:40px;margin-top:44px;cursor:pointer;}
.cover{width:186px;height:262px;border:1px solid var(--ink);display:flex;flex:none;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.cover:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--red);}
.cover.wx:before{background:var(--green);}
.cover span{font-family:"LXGW WenKai",serif;font-size:25px;line-height:1.55;text-align:center;}
.hero-info{flex:1;padding-top:6px;}
.kicker{font-size:20px;color:var(--red);letter-spacing:.22em;}
.hero-info h1{font-family:"LXGW WenKai",serif;font-size:38px;font-weight:400;margin:14px 0 8px;}
.author{font-size:22px;color:var(--sub);}
.progress{height:4px;background:var(--wash);margin:26px 0 12px;}
.progress i{display:block;height:4px;background:var(--red);}
.progress.wx i{background:var(--green);}
.meta{font-size:20px;color:var(--sub);}
.tabs{display:flex;gap:36px;align-items:baseline;margin:34px 0 4px;border-bottom:1px solid var(--rule);}
.tabs span{font-family:"LXGW WenKai",serif;font-size:25px;color:var(--faint);padding-bottom:14px;cursor:pointer;}
.tabs span.on{color:var(--ink);border-bottom:2px solid var(--red);}
.tabs .count{margin-left:auto;font-size:19px;color:var(--faint);}
.row{display:flex;align-items:center;gap:22px;padding:13px 0;border-bottom:1px solid var(--rule);cursor:pointer;}
.mini{width:64px;height:90px;border:1px solid var(--ink);flex:none;position:relative;overflow:hidden;background:#EDE9DC;}
.mini:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red);}
.mini.wx:before{background:var(--green);}
.mini span{position:absolute;left:8px;top:8px;writing-mode:vertical-rl;font-family:"LXGW WenKai",serif;font-size:11px;}
.row .info{flex:1;}
.row .n{font-family:"LXGW WenKai",serif;font-size:26px;}
.row .m{font-size:17px;color:var(--faint);margin-top:5px;}
.row .p{font-size:20px;color:var(--sub);width:62px;text-align:right;}
.shelf-stat{margin-top:22px;font-size:19px;color:var(--faint);letter-spacing:.08em;}
.tabbar{position:absolute;left:84px;right:84px;bottom:46px;display:flex;justify-content:space-between;
        padding-top:26px;border-top:1px solid var(--rule);font-family:"LXGW WenKai",serif;font-size:24px;color:var(--faint);}
.tabbar span{cursor:pointer;}
.tabbar .on{color:var(--ink);border-bottom:2px solid var(--red);padding-bottom:8px;}

/* reader */
.reader{padding:52px 128px 40px;height:100%;display:flex;flex-direction:column;}
.read-top{display:flex;justify-content:space-between;align-items:center;font-size:20px;color:var(--sub);margin-bottom:14px;}
.page-wrap{flex:1;overflow:hidden;margin-top:40px;}
.page-text{font-family:"LXGW WenKai",serif;font-size:var(--fs);line-height:var(--lh);text-align:justify;
           column-width:824px;column-gap:104px;height:100%;}
.page-text p{text-indent:2em;margin-bottom:.5em;}
.page-text mark{background:var(--hl);}
.read-foot{display:flex;justify-content:space-between;align-items:baseline;font-size:19px;color:var(--sub);padding-top:18px;}
.tapzone{position:absolute;top:0;bottom:0;width:26%;cursor:pointer;z-index:5;}
.tapzone.left{left:0;} .tapzone.right{right:0;}
.selbar{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);
        padding:28px 84px;display:none;z-index:20;}
.selbar.on{display:block;}
.sel-quote{font-family:"LXGW WenKai",serif;font-size:20px;color:var(--sub);line-height:1.7;max-height:2.6em;overflow:hidden;}
.sel-acts{display:flex;border:1px solid var(--ink);margin-top:20px;}
.sel-acts div{flex:1;text-align:center;padding:18px 0;font-family:"LXGW WenKai",serif;font-size:23px;border-right:1px solid var(--rule);cursor:pointer;}
.sel-acts div:last-child{border-right:0;}
.sel-acts div.on{background:var(--ink);color:var(--paper);}

/* sheet / panel */
.mask{position:absolute;inset:0;background:rgba(35,35,31,.25);display:none;z-index:30;}
.mask.on{display:block;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);
       padding:38px 84px 44px;height:520px;transform:translateY(100%);transition:transform .22s;z-index:40;}
.sheet.on{transform:none;}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;}
.sheet-head .t{font-family:"LXGW WenKai",serif;font-size:28px;}
.sheet-head .s{font-size:19px;color:var(--sub);}
textarea{width:100%;height:232px;border:1px solid var(--rule);padding:22px;font-family:"LXGW WenKai",serif;
         font-size:24px;line-height:1.85;background:transparent;resize:none;outline:none;color:var(--ink);}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
.btn{padding:13px 38px;border:1px solid var(--ink);font-family:"LXGW WenKai",serif;font-size:24px;background:none;cursor:pointer;color:var(--ink);}
.btn.primary{background:var(--ink);color:var(--paper);}
.btn.ghost{border-color:var(--rule);color:var(--sub);}
.panel{position:absolute;right:0;top:0;bottom:0;width:680px;background:var(--paper);border-left:2px solid var(--ink);
       padding:56px 54px;transform:translateX(100%);transition:transform .22s;z-index:40;}
.panel.on{transform:none;}
.panel .hd{display:flex;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--rule);}
.panel .hd .t{font-family:"LXGW WenKai",serif;font-size:30px;}
.toc-list{list-style:none;margin-top:6px;}
.toc-list li{display:flex;gap:14px;padding:16px 0;font-family:"LXGW WenKai",serif;font-size:23px;color:var(--sub);cursor:pointer;}
.toc-list li.on{color:var(--ink);}
.toc-list li.on:before{content:"";width:4px;background:var(--red);}

/* words */
.chiprow{display:flex;gap:14px;margin-top:26px;}
.chiprow span{border:1px solid var(--rule);padding:9px 20px;font-size:19px;color:var(--sub);cursor:pointer;}
.chiprow span.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.card-word{font-family:Arial,sans-serif;font-size:76px;font-weight:700;margin:30px 0 4px;}
.ipa{font-size:25px;color:var(--sub);}
.pos{font-size:21px;color:var(--sub);margin-left:12px;}
.def{font-size:26px;line-height:1.6;margin:18px 0 20px;}
.roots{display:flex;gap:16px;padding:22px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:22px;}
.roots b{font-family:Arial,sans-serif;}
.roots span{color:var(--sub);}
.story{font-family:"LXGW WenKai",serif;font-size:22px;line-height:1.9;margin:20px 0 14px;text-align:justify;}
.family{font-size:20px;color:var(--sub);line-height:1.85;}
.family em{font-style:normal;color:var(--ink);}
.ex{margin-top:14px;font-size:21px;line-height:1.7;}
.ex .zh{font-family:"LXGW WenKai",serif;color:var(--sub);font-size:20px;}
.acts{display:flex;gap:18px;position:absolute;left:84px;right:84px;bottom:44px;}
.acts div{flex:1;height:88px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;
          font-family:"LXGW WenKai",serif;font-size:26px;cursor:pointer;}
.acts div.dim{border-color:var(--rule);color:var(--sub);}
.acts div.good{background:var(--ink);color:var(--paper);}

/* list rows (wordbook) */
.entry{padding:24px 0;border-bottom:1px solid var(--rule);cursor:pointer;}
.entry .hd{display:flex;align-items:baseline;gap:12px;}
.entry .hd .w{font-family:Arial,sans-serif;font-size:30px;font-weight:700;}
.entry .hd .pos{font-size:19px;}
.entry .src{font-family:"LXGW WenKai",serif;font-size:19px;color:var(--sub);margin-top:6px;}
.entry .quote{font-size:19px;color:#3b3b36;margin-top:8px;line-height:1.6;}
.entry .quote mark{background:var(--hl);}

/* misc */
.searchbar{display:flex;align-items:center;gap:14px;margin-top:30px;border:1px solid var(--ink);padding:18px 22px;}
.searchbar input{flex:1;border:0;background:none;outline:none;font-family:Arial,sans-serif;font-size:26px;color:var(--ink);}
.searchbar .scope{font-size:18px;color:var(--sub);border-left:1px solid var(--rule);padding-left:16px;}
.res-group{margin-top:28px;font-size:19px;color:var(--faint);letter-spacing:.2em;}
.res{padding:18px 0;border-bottom:1px solid var(--rule);font-size:23px;cursor:pointer;}
.res .s{font-size:18px;color:var(--sub);margin-top:6px;}
.hidden{display:none !important;}
.banner{margin-top:28px;border:1px solid var(--amber);padding:24px 26px;}
.banner .t{font-family:"LXGW WenKai",serif;font-size:24px;color:var(--amber);}
.banner .d{font-size:18px;color:var(--sub);margin-top:8px;line-height:1.7;}
.banner .b{display:flex;gap:14px;margin-top:16px;}
.banner .b span{border:1px solid var(--amber);color:var(--amber);padding:8px 22px;font-size:19px;cursor:pointer;}
.cloud-row{display:flex;align-items:center;gap:18px;padding:24px 0;border-bottom:1px solid var(--rule);}
.cloud-row .ct{flex:1;}
.cloud-row .n{font-family:"LXGW WenKai",serif;font-size:26px;}
.cloud-row .m{font-size:17px;color:var(--faint);margin-top:4px;}
.cloud-row .act{border:1px solid var(--ink);padding:8px 18px;font-size:18px;cursor:pointer;}
.cloud-row .act.dis{border-color:var(--rule);color:var(--faint);cursor:default;}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:26px 0;border-bottom:1px solid var(--rule);}
.setrow .k{font-family:"LXGW WenKai",serif;font-size:25px;}
.setrow .v{font-size:21px;color:var(--sub);}
input[type=range]{width:340px;accent-color:#23231F;}
.stat4{display:flex;margin-top:34px;border:1px solid var(--rule);}
.stat4 div{flex:1;text-align:center;padding:28px 0;border-right:1px solid var(--rule);}
.stat4 div:last-child{border-right:0;}
.stat4 b{display:block;font-family:Arial,sans-serif;font-size:44px;}
.stat4 span{font-size:18px;color:var(--sub);}
.toast{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
       padding:16px 30px;font-size:20px;border-radius:2px;opacity:0;transition:opacity .2s;z-index:90;pointer-events:none;}
.toast.on{opacity:1;}
</style>
</head>
<body>
<div id="device"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- 数据（原型用假数据） ---------------- */
const BOOKS = [
  {id:'guns',  t:'枪炮、病菌与钢铁', a:'贾雷德·戴蒙德', src:'wx', p:37,  ch:'第 8 章', cache:true},
  {id:'sapiens',t:'人类简史',       a:'尤瓦尔·赫拉利', src:'local', p:62, ch:'第 12 章'},
  {id:'courage',t:'被讨厌的勇气',   a:'岸见一郎',      src:'wx', p:18,  ch:'第 2 章', cache:true},
  {id:'rural',  t:'乡土中国',       a:'费孝通',        src:'local', p:100, ch:'第 3 章'},
  {id:'inside', t:'置身事内',       a:'兰小欢',        src:'wx', p:54,  ch:'第 2 章', cache:false},
  {id:'klara',  t:'克拉拉与太阳',   a:'石黑一雄',      src:'wx', p:12,  ch:'第 1 章', cache:true},
];
const CHAPTERS = ['前言　为什么说世界历史就像洋葱一样？','开场白　亚力的问题','第 1 章　人类社会的起跑线',
  '第 7 章　杏仁的前世今生','第 8 章　是苹果的问题，还是印第安人的问题？','第 9 章　斑马、不幸的婚姻和安娜卡列尼娜原则','第 10 章　辽阔的天空与偏斜的轴线'];
const TEXT = [
'我们已见识到各地区族群如何开始驯化野生植物。古人在迈出这么重大的一步时，其实对结果一无所知，不能预见自己生活方式的改变，也不知此举竟会影响后代子孙在历史上的地位。我们再回到早先的问题：加利福尼亚、欧洲、澳大利亚温带地区、非洲近赤道地带等土地肥沃、条件优越的地方，为什么没能自行发展出农业？',
'有两种不同的解释：一是问题出在当地人的身上，二是问题出在当地既有的野生植物上。从一方面来说，凡是热带或温带湿度适中的地区，都可长出许多可供驯化的野生植物。若环境不是问题，问题就出在当地族群的文化上。',
'我们将在下一章碰到类似的问题，如大型野生哺乳动物的驯化。动物驯化的问题较易解答，主要是动物的物种比植物少得多。全世界只有约 148 种大型陆栖食草性或杂食性哺乳动物有可能被驯化。',
'植物研究则不可能用这种方式。植物物种数量极为庞大，会开花的野生植物就多达 20 万种。这些野生植物是陆地植物的主流，几乎涵盖作物的全部。植物多如繁星，无法一一详加研究。',
'听到有这么多种会开花的野生植物，人们的第一反应可能是：地球上既然有这么多种野生植物，那么一个地方只要气候条件良好，能驯化成作物的物种就一定多得不得了。',
'但是，我们不得不说，绝大多数的野生植物用处不大，原因很明显：大多数是木本植物，没有可供食用的果实，也没有可食的叶子和块根。在 20 万种野生植物中，只有几千种可供人类食用。',
'然而，我们还是无法解释清楚为何有些地区就是无法驯化野生植物。最让人百思莫解的是，有几种植物在某地被驯化了，却无法在另一个地方被驯化。若已知某种植物确实可发展成有用的作物，为什么偏偏在一些地区无法发展？',
'这个问题把我们带回本书的主线：不是人种的高低，而是环境的差异。可驯化的动植物资源，在地球上的分布极不均匀，而这种不均匀，又通过粮食剩余、人口密度、社会分工，层层放大成了文明之间的差距。',
'换句话说，历史的走向并不是由某个民族的聪明或勤奋决定的，而是由他们脚下那块土地能提供什么决定的。这个结论听起来冷酷，却比任何文化优越论都更经得起推敲。',
'我们将在后面的章节里，逐一检验这条线索：从病菌的演化，到文字的传播，再到技术与制度的扩散。每一条线索都会指向同一个方向——地理，而不是人。',
'当然，这个解释也有它的边界。它无法说明为什么同一片土地上，不同时期会出现截然不同的社会形态；也无法说明个人的选择在历史中的作用。但它至少提供了一个可以检验的起点。',
];
const WORD = {
  w:'ambiguous', ipa:'/æmˈbɪɡjuəs/', pos:'adj.',
  def:'having more than one possible meaning, so it is not clear which one is intended',
  roots:[['ambi-','both'],['ag-','to drive'],['-ous','adj.']],
  story:'拉丁语 ambigere 原义是「把……往两边赶」。牧人挥鞭，羊群一半往左一半往右，队伍就散了——一个说法被同时推向两个方向，听的人自然抓不住落点。',
  family:'ambivalent　ambidextrous　ambition　agent　agenda',
  ex:["The contract's wording is deliberately ambiguous.",'Its conclusion was ambiguous: neither a promise nor a refusal.'],
  syn:'vague　·　equivocal　·　unclear', ant:'explicit　·　unambiguous　·　clear'
};
const WORDBOOK = [
  {w:'ambiguous', pos:'adj.', src:'《枪炮、病菌与钢铁》第 8 章', q:'…deliberately %ambiguous%, leaving room for both sides…'},
  {w:'susceptible', pos:'adj.', src:'《乡土中国》第 3 章', q:'…villages were %susceptible% to drought…'},
  {w:'inevitable', pos:'adj.', src:'《置身事内》第 2 章', q:'…centralisation was %inevitable% once…'},
  {w:'consensus', pos:'n.', src:'雅思核心 3500 · 社会', q:'There is a growing %consensus% that the policy has failed.'},
  {w:'erode', pos:'v.', src:'雅思核心 3500 · 环境', q:'Coastal land is being %eroded% at an alarming rate.'},
];

/* ---------------- 状态 ---------------- */
const S = {
  screen:'boot', prev:[], tab:'全部', font:27, lh:1.92, offline:false, logged:true,
  page:0, pages:1, book:null, selText:'', highlights:[], toastTimer:null,
  wordIdx:0, reviewLeft:35, noteDraft:'', search:'', searchScoped:false,
  wechatSynced:'09:38', pending:2
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(S.toastTimer); S.toastTimer=setTimeout(()=>t.classList.remove('on'),1400); }

/* ---------------- 主题 / 缩放 ---------------- */
function fit(){
  const d=$('#device'), pad=40;
  const k=Math.min((innerWidth-pad)/1080,(innerHeight-pad)/1430);
  d.style.transform=`scale(${k})`;
}
addEventListener('resize',fit);

/* ---------------- 通用部件 ---------------- */
const battery = `<svg width="30" height="26" viewBox="0 0 30 24" fill="none" stroke="#6F6C63" stroke-width="1.7"><rect x="2" y="7" width="21" height="10" rx="1.5"/><path d="M25.5 10.5 v3"/><rect x="4.5" y="9.5" width="13" height="5" fill="#6F6C63" stroke="none"/></svg>`;
const wifi = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6F6C63" stroke-width="1.7" stroke-linecap="round"><path d="M2.6 8.6 C6.4 4.8 17.6 4.8 21.4 8.6"/><path d="M5.6 12.2 C8.4 9.4 15.6 9.4 18.4 12.2"/><path d="M8.7 15.7 C10.4 14 13.6 14 15.3 15.7"/><circle cx="12" cy="19.2" r="1.5" fill="#6F6C63" stroke="none"/></svg>`;

function statusBar(txt){
  const net = S.offline ? '' : wifi;
  return `<div class="status"><span>${txt||'09:41'}</span>${net}${battery}<span>78%</span></div>`;
}
function tabbar(active){
  const items=[['home','书架'],['wechat','微信读书'],['today','单词'],['settings','设置']];
  return `<nav class="tabbar">${items.map(([k,n])=>
    `<span class="${active===k?'on':''}" data-go="${k}">${n}</span>`).join('')}</nav>`;
}

/* ---------------- 屏：开机 ---------------- */
function sBoot(){
  return `<section class="screen boot" data-go="home">
    <svg width="156" height="156" viewBox="0 0 200 200" style="margin-bottom:38px">
      <g fill="#23231F"><rect x="58" y="56" width="15" height="86"/><rect x="80" y="74" width="15" height="68"/>
      <rect x="102" y="90" width="15" height="52"/><rect x="124" y="74" width="15" height="68"/><rect x="146" y="56" width="15" height="86"/></g>

/* ---------------- 路由 ---------------- */
const SCREENS = {boot:sBoot, home:sHome, wechat:sWechat, reader:sReader, today:sToday, card:sCard,
  wordbook:sWordbook, word:sWordDetail, review:sReview, compose:sCompose, search:sSearch, atlas:sAtlas, settings:sSettings};

function go(name, opts={}){
  if(S.screen!==name) S.prev.push(S.screen);
  S.screen=name; Object.assign(S,opts); render();
}
function back(){ const p=S.prev.pop()||'home'; S.screen=p; render(); }

function render(){
  const html=(SCREENS[S.screen]||sHome)();
  $('#device').innerHTML=html;
  if(S.screen==='reader') paginate();
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', e=>{
  if(S.screen==='reader' && !e.target.closest('.selbar') && !e.target.closest('.panel') && !e.target.closest('.sheet') && !e.target.closest('.mask')){
    if(String(getSelection()).trim()) return;      // 有选区时不翻页
    const r=$('#device').getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width;
    if(x<0.28){ stepPage(-1); return; }
    if(x>0.72){ stepPage(1); return; }
    toggleChrome(); return;
  }
  const t=e.target;
  const goEl=t.closest('[data-go]'); if(goEl){ return go(goEl.dataset.go); }
  const tab=t.closest('[data-tab]'); if(tab){ S.tab=tab.dataset.tab; return render(); }
  const open=t.closest('[data-open]'); if(open){ S.book=BOOKS.find(b=>b.id===open.dataset.open); S.page=0; return go('reader'); }
  const act=t.closest('[data-act]'); if(act){ return action(act.dataset.act); }
  const rate=t.closest('[data-rate]'); if(rate){ return rateWord(rate.dataset.rate); }
  const w=t.closest('[data-word]'); if(w){ S.book=w.dataset.word; return go('word'); }
});

function stepPage(d){
  const next=S.page+d;
  if(next<0){ toast('已经是第一页'); return; }
  if(next>=S.pages){ toast('本章读完，下一章待实现'); return; }
  S.page=next;
  const inner=$('#pages'); if(inner) inner.style.transform=`translateX(${-S.page*934}px)`;
  const no=$('#pageno'); if(no) no.textContent=`${S.page+1} / ${S.pages}`;
  if(S.book&&S.book.src==='wx'){ S.pending=Math.min(9,S.pending+1); }
}

function toggleChrome(){
  let c=$('#chrome'); if(!c) return;
  if(c.style.display==='none'||!c.style.display){
    c.innerHTML=`<div class="panel on" style="width:100%;transform:none;border-left:0;padding:60px 84px">
      <div class="hd"><div class="t">${S.book?S.book.t:''}</div><div class="meta">${S.page+1} / ${S.pages}</div></div>
      <div class="toc-list">
        ${CHAPTERS.map((x,i)=>`<li class="${i===4?'on':''}" data-chapter="${i}"><span>${x}</span></li>`).join('')}
      </div>
      <div style="position:absolute;left:84px;right:84px;bottom:50px;display:flex;gap:16px">
        <div class="btn" style="flex:1;text-align:center" data-go="wordbook">生词本</div>
        <div class="btn" style="flex:1;text-align:center" data-go="home">回到书架</div>
      </div></div>`;
    c.style.display='block';
  } else { c.style.display='none'; c.innerHTML=''; }
}

function action(a){
  if(a==='retry'){ S.offline=false; toast('已重新连接'); return render(); }
  if(a==='download'){ toast('原型里下载是模拟的'); return; }
  if(a==='toggle-offline'){ S.offline=!S.offline; toast(S.offline?'已模拟断网':'已恢复连接'); return render(); }
  if(a==='flush'){ S.pending=0; toast('进度已回写'); return render(); }
  if(a==='export'){ toast('原型：导出 Markdown / CSV / Anki'); return; }
  if(a==='save'){ toast('已保存'); return; }
  if(a==='grade'){ return grade(); }
}
function rateWord(k){
  const map={forget:'忘了，明天再来',vague:'有点模糊，后天再见',know:'认识，间隔拉长'};
  toast(map[k]); S.wordIdx++;
  S.reviewLeft=Math.max(0,S.reviewLeft-1);
  setTimeout(()=>go('today'),700);
}
function grade(){
  const txt=($('#compose')||{}).value||'';
  if(txt.trim().length<6){ toast('多写几个词再批改'); return; }
  $('#gradeslot').innerHTML=`
    <div class="res-group">批改</div>
    <div style="border:1px solid var(--rule);padding:22px 24px;margin-top:12px">
      <div style="display:flex;justify-content:space-between;font-size:20px">
        <span style="color:var(--green)">语法没有问题</span><span style="border:1px solid var(--ink);padding:3px 12px">预估 6.0</span></div>
      <div style="font-size:19px;line-height:1.7;margin-top:12px">用词　<b>could not tell</b> 建议改成 <b>couldn't tell</b>，口语更自然</div>
      <div style="font-size:19px;line-height:1.7;margin-top:8px">搭配　句尾可补 <b>agreed or not</b>，让“含糊”落到具体的事上</div>
      <div style="color:var(--green);font-size:19px;margin-top:12px">建议句：${esc(txt)} — and I couldn't tell whether he agreed or not.</div>
    </div>`;
}

/* 划线：选中文字后出现工具条 */
document.addEventListener('mouseup', ()=>{
  if(S.screen!=='reader') return;
  const gs=window.getSelection();
  const sel=String(gs);
  if(sel.trim().length<2) return;
  S.selText=sel.trim().slice(0,60);
  S.selRange=gs.rangeCount? gs.getRangeAt(0).cloneRange(): null;
  const bar=$('#selbar');
  bar.innerHTML=`<div class="sel-quote">「${esc(S.selText)}」　已选 ${sel.trim().length} 字</div>
    <div class="sel-acts"><div class="on" data-hl="1">高亮</div><div data-hl="note">笔记</div>
    <div data-hl="trans">翻译</div><div data-hl="copy">复制</div><div data-hl="close">取消</div></div>`;
  bar.classList.add('on');
});
document.addEventListener('mousedown', e=>{
  const hl=e.target.closest('[data-hl]'); if(!hl) return;
  e.preventDefault();
  const k=hl.dataset.hl;
  if(k==='close'){ $('#selbar').classList.remove('on'); getSelection().removeAllRanges(); return; }
  if(k==='copy'){ navigator.clipboard?.writeText(S.selText); toast('已复制'); }
  if(k==='trans'){ toast('原型：翻译走本地词典'); }
  if(k==='note'){ openNote(); }
  if(k==='1'){
    if(S.selRange){
      const m=document.createElement('mark');
      try{ S.selRange.surroundContents(m); }
      catch(_){ try{ m.appendChild(S.selRange.extractContents()); S.selRange.insertNode(m); }catch(__){} }
    }
    S.highlights.push(S.selText); toast('已高亮');
  }
  $('#selbar').classList.remove('on');
}, true);

function openNote(){
  const d=$('#device');
  d.insertAdjacentHTML('beforeend', `<div class="mask on" id="m"></div>
    <div class="sheet on" id="noteSheet">
      <div class="sheet-head"><div class="t">笔记</div><div class="s">第 8 章 · 本机已存 3 条</div></div>
      <textarea id="notetext" placeholder="写下你的想法…"></textarea>
      <div class="sheet-foot"><div class="meta" style="color:var(--green)">● 本机保存，不会同步回微信读书</div>
        <div style="display:flex;gap:16px"><button class="btn ghost" id="ncancel">取消</button>
        <button class="btn primary" id="nsave">保存</button></div></div></div>`);
  $('#ncancel').onclick=()=>{ $('#m').remove(); $('#noteSheet').remove(); };
  $('#nsave').onclick=()=>{ $('#m').remove(); $('#noteSheet').remove(); toast('笔记已保存'); };
}

/* 搜索输入 */
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ S.search=e.target.value; const pos=e.target.selectionStart; render();
    const q=$('#q'); if(q){ q.focus(); q.setSelectionRange(pos,pos); } }
  if(e.target.id==='fs'){ S.font=+e.target.value; }
  if(e.target.id==='lh'){ S.lh=+e.target.value/100; }
});
document.addEventListener('change', e=>{
  if(e.target.id==='fs'||e.target.id==='lh'){ toast('已应用，回到阅读查看'); }
});

fit(); render();
</script>
</body>
</html>
