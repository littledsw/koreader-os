input[type=range]{width:300px;accent-color:#23231F;}

.stat4 span{font-size:18px;color:var(--sub);}
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
       padding:14px 26px;font-size:20px;opacity:0;transition:opacity .2s;z-index:95;pointer-events:none;white-space:nowrap;}

<script>
/* ============ 数据 ============ */
const BOOKS = [
  {id:'guns',  t:'枪炮、病菌与钢铁', a:'贾雷德·戴蒙德', src:'wx',    p:37, ch:'第 8 章', cache:true},
  {id:'sapiens',t:'人类简史',       a:'尤瓦尔·赫拉利', src:'local', p:62, ch:'第 12 章'},
  {id:'courage',t:'被讨厌的勇气',   a:'岸见一郎',      src:'wx',    p:18, ch:'第 2 章', cache:true},
  {id:'rural',  t:'乡土中国',       a:'费孝通',        src:'local', p:100,ch:'第 3 章'},
  {id:'inside', t:'置身事内',       a:'兰小欢',        src:'wx',    p:54, ch:'第 2 章', cache:false},
  {id:'klara',  t:'克拉拉与太阳',   a:'石黑一雄',      src:'wx',    p:12, ch:'第 1 章', cache:true},
];
const CHAPTERS = ['前言　为什么说世界历史就像洋葱一样？','开场白　亚力的问题','第 1 章　人类社会的起跑线',
  '第 7 章　杏仁的前世今生','第 8 章　是苹果的问题，还是印第安人的问题？','第 9 章　斑马、不幸的婚姻和安娜卡列尼娜原则','第 10 章　辽阔的天空与偏斜的轴线'];
const TEXT = [
'我们已见识到各地区族群如何开始驯化野生植物。古人在迈出这么重大的一步时，其实对结果一无所知，不能预见自己生活方式的改变，也不知此举竟会影响后代子孙在历史上的地位。我们再回到早先的问题：加利福尼亚、欧洲、澳大利亚温带地区、非洲近赤道地带等土地肥沃、条件优越的地方，为什么没能自行发展出农业？',
'有两种不同的解释：一是问题出在当地人的身上，二是问题出在当地既有的野生植物上。从一方面来说，凡是热带或温带湿度适中的地区，都可长出许多可供驯化的野生植物。若环境不是问题，问题就出在当地族群的文化上。',
'我们将在下一章碰到类似的问题，如大型野生哺乳动物的驯化。动物驯化的问题较易解答，主要是动物的物种比植物少得多。全世界只有约 148 种大型陆栖食草性或杂食性哺乳动物有可能被驯化。',
'植物研究则不可能用这种方式。植物物种数量极为庞大，会开花的野生植物就多达 20 万种。这些野生植物是陆地植物的主流，几乎涵盖作物的全部。植物多如繁星，无法一一详加研究。',
'听到有这么多种会开花的野生植物，人们的第一反应可能是：地球上既然有这么多种野生植物，那么一个地方只要气候条件良好，能驯化成作物的物种就一定多得不得了。',
'但是，我们不得不说，绝大多数的野生植物用处不大，原因很明显：大多数是木本植物，没有可供食用的果实，也没有可食的叶子和块根。在 20 万种野生植物中，只有几千种可供人类食用。',
'然而，我们还是无法解释清楚为何有些地区就是无法驯化野生植物。最让人百思莫解的是，有几种植物在某地被驯化了，却无法在另一个地方被驯化。',
'这个问题把我们带回本书的主线：不是人种的高低，而是环境的差异。可驯化的动植物资源，在地球上的分布极不均匀，而这种不均匀，又通过粮食剩余、人口密度、社会分工，层层放大成了文明之间的差距。',
];
const WORDS = [
 {w:'ambiguous', ipa:'/æmˈbɪɡjuəs/', pos:'adj.', def:'having more than one possible meaning, so it is not clear which one is intended',
  roots:[['ambi-','both'],['ag-','to drive'],['-ous','adj.']],
  story:'拉丁语 ambigere 原义是「把……往两边赶」。牧人挥鞭，羊群一半往左一半往右，队伍就散了——一个说法被同时推向两个方向，听的人自然抓不住落点。',
  family:'ambivalent　ambidextrous　ambition　agent　agenda',

 {w:'susceptible', ipa:'/səˈseptəbl/', pos:'adj.', def:'easily affected or influenced by something',
  roots:[['sus-','under'],['cept-','to take'],['-ible','able to']],
  story:'suscipio 是「从下面接住」。接得住，就容易被落下来的东西影响——于是 susceptible 既是「易受影响的」，也是「易感的」。',
  family:'accept　receive　capture　concept',
  ex:['Villages were susceptible to drought and to the whims of the market.','Children are more susceptible to infection.']},
 {w:'inevitable', ipa:'/ɪnˈevɪtəbl/', pos:'adj.', def:'certain to happen; impossible to avoid',
  roots:[['in-','not'],['evit-','to avoid'],['-able','able to']],
  story:'evitare 是「躲开」。躲不开的，就是 inevitable。同族的 evitable 反而很少用——因为值得说的，总是躲不开的那件事。',
  family:'evitable　inevitability',
  ex:['Some degree of centralisation was inevitable once the tax system collapsed.','War seemed inevitable.']},
 {w:'consensus', ipa:'/kənˈsensəs/', pos:'n.', def:'an opinion that everyone in a group agrees with',

  story:'拉丁 consensus 原是「共同感觉」——不是投票投出来的，是大家感觉到一块儿去了。',

 {w:'erode', ipa:'/ɪˈrəʊd/', pos:'v.', def:'to wear away gradually',

  story:'rodere 是「啃」。水一点点啃掉岸，信任一点点被啃掉，都是 erode。',
  family:'erosion　corrode　rodent',
  ex:['Coastal land is being eroded at an alarming rate.','Confidence in the system has eroded.']},

  {slug:'chinese-pangolin', zh:'中华穿山甲', en:'Chinese pangolin', latin:'Manis pentadactyla', cr:'摄 · @weitingliu · CC BY 4.0',

}

    `<div class="dist"><span>${n}</span><div class="progress" style="flex:1;margin:0"><i style="width:${p}%"></i></div>
     <b style="width:56px;text-align:right;font-family:Arial,sans-serif">${c}</b></div>`).join('')}
</section>`;

V.settings = ()=> `<section class="screen pad">
  ${bar('设置')}
  <div class="res-group">排版</div>
  <div class="setrow"><div class="k">中文字体</div><div class="v">霞鹜文楷 / 宋体</div></div>
  <div class="setrow"><div class="k">字号</div><input type="range" min="22" max="34" value="${S.font}" id="fs"></div>
  <div class="setrow"><div class="k">行距</div><input type="range" min="160" max="220" value="${S.lh*100}" id="lh"></div>
  <div class="res-group">微信读书</div>
  <div class="setrow"><div class="k">服务</div><div class="v">192.168.1.20:8080　<span style="color:${S.offline?'var(--amber)':'var(--green)'}">${S.offline?'离线':'在线'}</span></div></div>
  <div class="setrow"><div class="k">模拟断网</div><div class="v"><span style="border:1px solid var(--ink);padding:6px 16px;cursor:pointer" data-act="toggle-offline">${S.offline?'已断开':'未断开'}</span></div></div>
  <div class="setrow"><div class="k">待回写</div><div class="v">${S.pending} 条　<span style="color:var(--green);cursor:pointer" data-act="flush">立即同步</span></div></div>
  <div class="res-group">数据</div>
  <div class="setrow"><div class="k">笔记与划线</div><div class="v"><span style="cursor:pointer" data-go="notes">${S.notes.length} 条笔记 · ${S.highlights.length} 条划线 →</span></div></div>
  ${tabs('settings')}</section>`;

/* ============ 路由 ============ */
const SCREENS = V;
function go(name, params={}){
  if(name!==S.screen) S.stack.push({name:S.screen, params:{book:S.book, page:S.page, scope:S.scope}});
  S.screen=name; Object.assign(S, params); render();
}
function back(){
  const prev=S.stack.pop();
  if(!prev){ S.screen='home'; return render(); }
  S.screen=prev.name; Object.assign(S, prev.params||{}); render();
}
function render(){
  const fn=SCREENS[S.screen]||V.home;
  $('#device').innerHTML=fn();
  if(S.screen==='reader') paginate();
}

/* ============ 阅读分页 ============ */
function paginate(){
  setTimeout(()=>{
    const inner=$('#pages'); if(!inner) return;
    const step=928;
    S.pages=Math.max(1,Math.round(inner.scrollWidth/step));
    if(S.page>=S.pages) S.page=S.pages-1;
    const no=$('#pageno'); if(no) no.textContent=`${S.page+1} / ${S.pages}`;
    inner.style.transform=`translateX(${-S.page*step}px)`;
  },30);
}
function turn(d){
  const n=S.page+d;
  if(n<0){ toast('已经是第一页'); return; }
  if(n>=S.pages){ toast('本章读完，下一章待实现'); return; }
  S.page=n;
  $('#pages').style.transform=`translateX(${-S.page*928}px)`;
  $('#pageno').textContent=`${S.page+1} / ${S.pages}`;
}

/* ============ 单词流程 ============ */
function startQueue(mode){
  S.reviewMode = mode==='review';
  S.wordQueue = mode==='review' ? [0,1,2,3,4] : [0,1,2];
  S.wordIdx=0; S.knowCount=0;
  go('card');
}
function rate(k){
  if(k==='know') S.knowCount++;
  if(!S.reviewMode) S.todayDone=Math.min(20,S.todayDone+1);
  else S.reviewLeft=Math.max(0,S.reviewLeft-1);
  S.wordIdx++;
  if(S.wordIdx>=S.wordQueue.length){ S.screen='worddone'; return render(); }
  render();
}

/* ============ 交互 ============ */
document.addEventListener('click', e=>{
  const t=e.target;
  if(t.closest('[data-panel-close]')){ const pn=$('#panel'); if(pn) pn.classList.remove('on'); return; }
  if(t.closest('[data-back]')) return back();
  if(S.screen==='reader' && !t.closest('.selbar') && !t.closest('.panel') && !t.closest('.sheet')
     && !t.closest('.mask') && !t.closest('.read-top') && !t.closest('.read-foot')){
    if(String(getSelection()).trim()) return;
    const r=$('#device').getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width;
    if(x<0.28) return turn(-1);
    if(x>0.72) return turn(1);
    return openPanel();
  }
  const g=t.closest('[data-go]'); if(g) return go(g.dataset.go);
  const tb=t.closest('[data-tab2]'); if(tb) return go(tb.dataset.tab2);
  const sh=t.closest('[data-shelftab]'); if(sh){ S.shelfTab=sh.dataset.shelftab; return render(); }
  const se=t.closest('[data-search]'); if(se){ return go('search',{scope:se.dataset.search==='module'?'module':'all',search:''}); }
  const o=t.closest('[data-open]'); if(o){ S.book=BOOKS.find(x=>x.id===o.dataset.open); S.page=0; return go('reader'); }
  const w=t.closest('[data-word]'); if(w){ S.book=w.dataset.word; return go('word'); }
  const a=t.closest('[data-animal]'); if(a){ S.animalIdx=(S.animalIdx+ +a.dataset.animal + ANIMALS.length)%ANIMALS.length; return render(); }
  const r=t.closest('[data-rate]'); if(r) return rate(r.dataset.rate);
  const act=t.closest('[data-act]'); if(act) return doAct(act.dataset.act);
});

function doAct(a){
  if(a==='retry'){ S.offline=false; toast('已重新连接'); return render(); }
  if(a==='download'){ toast('原型：下载是模拟的'); return; }
  if(a==='toggle-offline'){ S.offline=!S.offline; toast(S.offline?'已模拟断网':'已恢复连接'); return render(); }
  if(a==='flush'){ S.pending=0; toast('进度已回写'); return render(); }
  if(a==='export'){ toast('原型：导出 Markdown / CSV / Anki'); return; }
  if(a==='go-card'){ return startQueue('new'); }
  if(a==='start-review'){ return startQueue('review'); }
  if(a==='remove-word'){ toast('已移出生词本'); return back(); }
  if(a==='grade'){ return grade(); }
}

function openPanel(){
  const p=$('#panel'); if(!p) return;
  p.innerHTML=`
    <div class="phd"><div class="t">目录</div><div class="pclose" data-panel-close="1">${closeX}</div></div>
    <div class="toc-list">${CHAPTERS.map((c,i)=>`<li class="${i===4?'on':''}">${c}</li>`).join('')}</div>
    <div class="pgroup">
      <div class="prow" data-go="search"><span>本书搜索</span><span class="chev">${chevR}</span></div>
      <div class="prow" data-go="notes"><span>笔记与划线</span><span class="pnum">${S.notes.length} 条</span><span class="chev">${chevR}</span></div>
    </div>
    <nav class="tabbar" style="left:84px;right:84px">
      <span data-go="home">书架</span><span data-go="wechat">微信读书</span>
      <span data-go="today">单词</span><span data-go="settings">设置</span></nav>`;
  p.classList.add('on');
}

/* 划词 */
document.addEventListener('mouseup', ()=>{
  if(S.screen!=='reader') return;
  const gs=window.getSelection(), sel=String(gs);
  if(sel.trim().length<2) return;
  S.selText=sel.trim().slice(0,60);
  S.selRange=gs.rangeCount?gs.getRangeAt(0).cloneRange():null;
  const bar=$('#selbar');
  bar.innerHTML=`<div class="sel-quote">「${esc(S.selText)}」　已选 ${sel.trim().length} 字</div>
    <div class="sel-acts"><div class="on" data-hl="1">高亮</div><div data-hl="note">笔记</div>
    <div data-hl="trans">翻译</div><div data-hl="copy">复制</div><div data-hl="close">取消</div></div>`;
  bar.classList.add('on');
});
document.addEventListener('mousedown', e=>{
  const hl=e.target.closest('[data-hl]'); if(!hl) return;
  e.preventDefault();
  const k=hl.dataset.hl;
  if(k==='close'){ $('#selbar').classList.remove('on'); getSelection().removeAllRanges(); return; }
  if(k==='copy'){ navigator.clipboard?.writeText(S.selText); toast('已复制'); }
  if(k==='trans'){ toast('原型：走本地词典'); }
  if(k==='note'){ openNote(); }
  if(k==='1'){
    if(S.selRange){ const m=document.createElement('mark');
      try{ S.selRange.surroundContents(m); }catch(_){ try{ m.appendChild(S.selRange.extractContents()); S.selRange.insertNode(m);}catch(__){} } }
    S.highlights.push(S.selText); toast(`已高亮 · 共 ${S.highlights.length} 条，可在笔记页查看`);
  }
  $('#selbar').classList.remove('on');
}, true);

function openNote(){
  $('#device').insertAdjacentHTML('beforeend', `<div class="mask on" id="m"></div>
    <div class="sheet" id="ns">
      <div class="sheet-head"><div class="t">笔记</div><div class="s">${S.book?S.book.ch:'第 8 章'}</div></div>
      <textarea id="nt" placeholder="写下你的想法…">${esc(S.selText)}：</textarea>
      <div class="sheet-foot"><div class="meta" style="color:var(--green)">● 本机保存，不会同步回微信读书</div>
        <div style="display:flex;gap:12px"><button class="btn ghost" id="nc">取消</button>
        <button class="btn primary" id="nv">保存</button></div></div></div>`);
  $('#m').onclick=()=>{ $('#m').remove(); $('#ns').remove(); };
  $('#nc').onclick=()=>{ $('#m').remove(); $('#ns').remove(); };
  $('#nv').onclick=()=>{
    const text=($('#nt').value||'').trim();
    if(!text){ toast('写点什么再保存'); return; }
    S.notes.unshift({id:Date.now(),text,quote:S.selText,book:S.book?S.book.t:'枪炮、病菌与钢铁',
      chapter:S.book?S.book.ch:'第 8 章',time:'刚刚'});
    $('#m').remove(); $('#ns').remove(); toast(`已保存，共 ${S.notes.length} 条笔记`);
  };
}

/* 搜索输入 */
document.addEventListener('input', e=>{
  if(e.target.id==='q'){
    S.search=e.target.value; const pos=e.target.selectionStart; render();
    const q=$('#q'); if(q){ q.focus(); q.setSelectionRange(pos,pos); }
  }
  if(e.target.id==='fs') S.font=+e.target.value;
  if(e.target.id==='lh') S.lh=+e.target.value/100;
});

function grade(){
  const v=($('#compose')||{}).value||'';
  if(v.trim().length<6){ toast('多写几个词再批改'); return; }
  $('#gradeslot').innerHTML=`<div class="res-group">批改</div>
    <div style="border:1px solid var(--rule);padding:20px 22px;margin-top:10px">
      <div style="display:flex;justify-content:space-between;font-size:20px">
        <span style="color:var(--green)">语法没有问题</span><span style="border:1px solid var(--ink);padding:3px 12px">预估 6.0</span></div>
      <div style="font-size:19px;line-height:1.7;margin-top:12px">用词　<b>could not tell</b> 建议改成 <b>couldn't tell</b>，口语更自然</div>
      <div style="font-size:19px;line-height:1.7;margin-top:8px">搭配　句尾可补 <b>agreed or not</b>，让“含糊”落到具体的事上</div>
      <div style="color:var(--green);font-size:19px;margin-top:12px">建议句：${esc(v)} — and I couldn't tell whether he agreed or not.</div></div>`;
}

/* 启动 */
fit();
S.notes.push({id:1,text:'戴蒙德的答案是“环境”，不是“人种”。',
  quote:'有两种不同的解释：一是问题出在当地人的身上，二是问题出在当地既有的野生植物上。',
  book:'枪炮、病菌与钢铁',chapter:'第 8 章',time:'2 小时前'});
render();
</script>
</body>
</html>
